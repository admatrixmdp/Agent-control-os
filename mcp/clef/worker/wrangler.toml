# Cổng quyết định Clef. Không có secret trong file này. CHƯA deploy.
name = "clef-gate"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true                           # giai đoạn thử; chuyển sang route riêng TRƯỚC khi nối dữ liệu thật
# account_id = "THAY-ACCOUNT-ID"            # điền lúc deploy, không commit token
# routes = [{ pattern = "clef.example.com/*", zone_name = "example.com" }]

[ai]
binding = "AI"                               # Workers AI: env.AI.run("@cf/cloudflare/clef", ...)

[[kv_namespaces]]
binding = "CACHE"
id = "THAY-KV-NAMESPACE-ID"

[[ratelimits]]                               # giới hạn theo bên gọi (key = tên bên gọi)
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
ALLOWED_CALLERS = "caller-a,caller-b"        # danh sách bên gọi; secret: CALLER_SECRET_<TEN_IN_HOA>
CLEF_TIMEOUT_MS = "8000"
COST_PER_M_TOKENS = "0"                      # điền đơn giá thật khi có
# AI_GATEWAY_ID = "THAY-GATEWAY-ID"

# Secret, mỗi bên gọi một cái (chỉ tên, đặt bằng `wrangler secret put <TEN>`):
#   CALLER_SECRET_CALLER_A
#   CALLER_SECRET_CALLER_B
