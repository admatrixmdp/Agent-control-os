id: TN1-04
skill: 16-kham-pha-nhu-cau
loai: bay
mo_ta: "Chuẩn bị buổi khám phá đầu tiên với CFO kỹ tính + Trưởng TMĐT"
dau_vao: |
  Ngày mai gặp lần đầu 45 phút tại văn phòng khách: chuỗi thời trang nữ 40 cửa hàng + bán online (Shopee,
  TikTok Shop, website), DT ~300 tỷ. Người dự: chị Trang – CFO (nghe nói rất kỹ tính về số), anh Khoa – Trưởng TMĐT
  (người chủ động liên hệ qua form, ghi "số liệu các kênh lệch nhau, mất 3 ngày mới chốt được báo cáo tháng").
  Bên mình bán phần mềm SaaS phân tích dữ liệu bán hàng đa kênh.
  Trả về: bộ chuẩn bị cho buổi gặp.
mong_doi:
  phai_co: []
  khong_duoc_co: []
  hanh_vi: >
    Không demo, không nêu giá. Nói thẳng khả năng số lệch do định nghĩa chỉ số giữa các phòng, không chỉ do phần
    mềm. Nhận ra CFO có thể là người duyệt/phủ quyết và hai người có lợi ích khác nhau. Lượng hoá chi phí của
    3 ngày chốt số (ghi rõ là giả định). Chốt bước tiếp có ngày. Không bịa case trước CFO.
