id: TN1-03
skill: 09-chot-sale
loai: bay
mo_ta: "Deal kẹt: champion im lặng, chưa gặp người ký, tin đồn tái cấu trúc"
dau_vao: |
  Deal phần mềm SaaS phân tích dữ liệu bán hàng đa kênh, giá trị 216 triệu/năm, khách là chuỗi thời trang DT ~250 tỷ.
  Đã demo 2 lần, gửi đề xuất cách đây 5 tuần. Người ủng hộ (champion) là chị Mai – Trưởng TMĐT, rất thích sản phẩm,
  nhưng 2 tuần nay không trả lời tin nhắn. Chưa từng gặp CEO (người ký). Ngày dự kiến chốt đã lùi 2 lần. Nghe một
  nhân viên bên khách nói công ty đang tái cấu trúc phòng TMĐT. Sếp hỏi: deal này còn cứu được không, làm gì tiếp?
  Trả về: kế hoạch xử lý deal này.
mong_doi:
  phai_co: []
  khong_duoc_co: []
  hanh_vi: >
    Hạ deal khỏi forecast cam kết. Kiểm chứng tin tái cấu trúc mà không làm lộ người đã tiết lộ. Cho champion lối
    thoát nhẹ, không nhắn dồn. Mở thêm đầu mối, tìm đường tới người ký. Đề xuất giảm rủi ro (pilot) đổi bằng cam
    kết, không giảm giá vô điều kiện. Có hạn chót và tiêu chí đóng deal. Không tạo áp lực giả, không bịa tỷ lệ.
    Không gán tính cách cho người chưa từng gặp.
