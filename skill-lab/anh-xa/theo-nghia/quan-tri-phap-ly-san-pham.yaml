ghi_chu: >-
  Lô 290 (ceo-*, legal-*) là khung mỏng ~80-100 dòng, cùng một mẫu, đoạn "Tích hợp web" lặp và đường dẫn lưu file máy tác giả;
  lô update dày hơn, có bảng và mẫu điền. Nhiều skill pháp lý viện dẫn văn bản đã bị thay trong 2025-2026
  (NĐ 13/2023 đã bị Luật Bảo vệ dữ liệu cá nhân 2025 thay thế từ 1/1/2026, TAND cấp huyện đã bỏ, Sở KH&ĐT đã sáp nhập,
  lệ phí môn bài đã bãi bỏ từ 2026, NĐ 01/2021 về đăng ký DN đã được thay) — mọi phần lấy về phải viết lại theo văn bản hiện hành.
  Số tham chiếu không nguồn (hệ số EBITDA theo ngành, phí ISO, "giảm 20-40%") không được lấy.
