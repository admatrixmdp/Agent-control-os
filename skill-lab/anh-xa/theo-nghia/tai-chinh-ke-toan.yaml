ghi_chu_chung: >-
  Nội bộ mới có 3 skill tài chính – kế toán (ho-so-ke-toan, ho-so-tai-chinh, kiem-toan-noi-bo); phần lớn khái niệm
  đã có tên trong docs/ban-do-skill.md của Company-finance-accountant-os nhưng trạng thái 'chua' → gắn 'moi', ghi skill dự kiến trong lay_gi.
  Lỗi chung cả nhóm: (1) mục 'Bước 4 Tích hợp Web (MCP-first + API fallback)' ở lô 290 dùng endpoint bịa
  (api.misa.vn/sme/v1/..., openapi.vietcombank.com.vn, api.gdt.gov.vn/nnt, api.misa.vn/tax/v1/classify) → không lấy;
  (2) căn cứ pháp lý lỗi thời: TT200/2014 (thay bằng TT99/2025 từ 01/01/2026), NĐ218/2013 + TT78/2014 (thay theo Luật TNDN 2025),
  NĐ123/2020 chưa cập nhật NĐ70/2025, ngưỡng thanh toán không dùng tiền mặt 20 triệu (nay 5 triệu theo Luật GTGT 2024),
  giảm trừ gia cảnh 11/4,4 triệu (từ 2026: 15,5/6,2 triệu). Mọi đoạn lấy về phải viết lại có mã điều khoản [[...]] theo src/phap-ly.
  Tên trùng trong kho (bao-cao-tai-chinh, lap-ke-hoach-tai-chinh, phan-tich-tai-chinh, quan-ly-cong-no) phân biệt bằng duong_dan.
