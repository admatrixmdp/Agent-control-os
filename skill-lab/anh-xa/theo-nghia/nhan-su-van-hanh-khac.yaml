tong: 141
dem: {trung: 4, bo-sung: 5, moi: 85, loai: 47}
ghi_chu_chung: >
  Lô 290 (tiền tố hr-/ops-/it-/log-/proc-/data-) ngắn ~100 dòng, có bảng gọn nhưng mục "Tích Hợp Web Bên Ngoài
  (MCP-first + API fallback)" là khuôn chung, chứa endpoint bịa (vd legal-log.internal) và số liệu không nguồn
  (vd "DN thua >60%", "tiết kiệm 25-40%") — khi lấy phải cắt bỏ. Lô update (tên tiếng Việt) dài hơn, nhiều biểu mẫu
  điền sẵn, ít bịa số hơn nhưng có lỗi pháp lý (vd xu-ly-ky-luat ghi "3 trường hợp sa thải" trong khi Đ.125 BLLĐ 2019
  có 6 trường hợp). Mọi skill có căn cứ pháp lý phải rà lại trước khi dùng (BLLĐ 2019, NĐ 145/2020, NĐ 13/2023 và
  Luật Bảo vệ dữ liệu cá nhân 2025). Khi chọn bản tốt hơn trong cụm trùng, ưu tiên bản lô update vì ít code giả.
