# Ánh xạ 3 mức quyền sang hành động cụ thể và ngưỡng duyệt.
# Nguồn gốc 3 mức: AGENTS.md mục 3 (điểm nối, xem RANH-GIOI.md). File này không định nghĩa lại, chỉ ánh xạ.

nguon_muc_quyen: "AGENTS.md#3"

# Thứ tự xét: cam -> hoi_truoc -> tu_lam. Khớp đầu tiên theo thứ tự này quyết định.
# Hai nguồn luật lệch nhau về cùng hành động: giá trị chặt hơn thắng.
thu_tu_xet: [cam, hoi_truoc, tu_lam]
khi_nguon_lech: chat_hon_thang

# Loại hành động -> mức mặc định
hanh_dong:
  doc_du_lieu: tu_lam
  soan_nhap: tu_lam
  phan_tich: tu_lam
  gui_tin_ra_ngoai: hoi_truoc
  dang_noi_dung: hoi_truoc
  thay_doi_ngan_sach_quang_cao: hoi_truoc
  ghi_vao_he_thong_that: hoi_truoc   # tạo/sửa đơn, khách, sản phẩm, cấu hình shop
  xuat_hoa_don: hoi_truoc
  xoa_du_lieu_co_ban_sao: hoi_truoc
  thanh_toan_chuyen_tien: cam
  xoa_du_lieu_khong_ban_sao: cam
  sua_raw: cam

# Hỏi trước = nộp bản nháp hoàn chỉnh (nguyên tắc hoi-bang-ban-nhap).
hoi_truoc_phai_nop: ban_nhap_hoan_chinh

# Luật bộ ba (AGENTS.md mục 3). Agent có đủ 3 điều kiện thì gửi ra ngoài kèm dữ liệu riêng
# luôn là hoi_truoc, kể cả khi gui_tin_ra_ngoai đã được chuyển xuống tu_lam cho phạm vi nào đó.
bo_ba:
  dieu_kien:
    - co_du_lieu_rieng        # dữ liệu khách hoặc nội bộ
    - doc_noi_dung_nguoi_la   # tin nhắn, bình luận, email, trang web
    - gui_ra_ngoai
  khi_du_3: gui_ra_ngoai_kem_du_lieu_rieng = hoi_truoc
  ngoai_le: tra_loi_bang_thong_tin_cong_khai   # giá niêm yết, chính sách công khai

# Nâng mức theo quy mô: hành động "tu_lam" chạm ngưỡng thì thành "hoi_truoc".
# Để null đến khi có 2 tuần số đo nền (harness/DECISIONS.md).
nang_muc_khi:
  so_tien_vnd: null
  so_nguoi_nhan: null
  so_ban_ghi: null

# Thẻ duyệt gửi người: viết bằng ngôn ngữ nghiệp vụ, kèm bản nháp.
the_duyet:
  kenh: null               # zalo | lark — chờ Quân chốt
  truong_bat_buoc:
    - hanh_dong            # vd "Tạo đơn hàng"
    - ban_nhap             # nội dung đầy đủ sẽ ghi / gửi
    - so_ban_ghi           # vd 20 đơn
    - so_tien_vnd
    - so_khach_bi_anh_huong
    - hoan_tac_duoc        # có / không
  het_han_phut: null
  khi_het_han: tu_choi     # không trả lời = từ chối
